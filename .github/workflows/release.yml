# Publishes a signed APK on GitHub Releases when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Required repository secrets (see README): KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
name: Release APK

on:
  push:
    tags: ['v*']

# Needed to create the GitHub Release and upload the APKs.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart tests
        run: flutter test

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see README: Publicar una versión)"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APKs
        env:
          VERSION: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p dist
          # Works on every phone (32 and 64-bit ARM).
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Viddownloader-$VERSION.apk"
          # Smaller file for 64-bit phones (almost all recent phones).
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Viddownloader-$VERSION-arm64.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Viddownloader ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Descarga / Download

            - **Viddownloader-${{ steps.version.outputs.name }}.apk**: funciona en todos los móviles Android 8+ / works on every Android 8+ phone.
            - **Viddownloader-${{ steps.version.outputs.name }}-arm64.apk**: más pequeño, para móviles de 64 bits (casi todos los recientes) / smaller, for 64-bit phones.

            Si Android pregunta, permite "Instalar apps desconocidas" para tu navegador o gestor de archivos.
            If Android asks, allow "Install unknown apps" for your browser or file manager.

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties
