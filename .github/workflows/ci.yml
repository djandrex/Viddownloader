# Checks every push and pull request: analysis, Dart tests, Kotlin tests and
# a debug build (which compiles the native Android code).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Dart tests
        run: flutter test

      - name: Debug build (compiles the Kotlin code)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64
