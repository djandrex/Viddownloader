# Configuration for Flutter's official localization generator (gen-l10n).
# The generated code goes into lib/l10n/ and is imported as
# package:viddownloader/l10n/app_localizations.dart
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
